    <h2>Contact Info</h2>

    <div class="responsive-form">
      <form action="thankyou.html" method="get">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="name" placeholder="Your First Name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>

        <label for="sub">Subject:</label>
        <input type="text" id="sub" name="subject" placeholder="Your Subject" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Write something..." required></textarea>

        <input type="submit" value="Submit">
      </form>
    </div>

  </body>
